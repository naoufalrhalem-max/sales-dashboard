<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  body { font-family: "Segoe UI", Arial, sans-serif; background: #f3f5f8; margin: 0; color: #1f2937; }
  header { background: #0971CE; color: #fff; padding: 18px 28px; }
  header h1 { margin: 0; font-size: 22px; }
  .filters { display: flex; gap: 14px; flex-wrap: wrap; padding: 14px 28px; background: #fff; border-bottom: 1px solid #e5e7eb; }
  .filters label { font-size: 12px; color: #6b7280; display: flex; flex-direction: column; gap: 4px; }
  select, input { padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; min-width: 180px; }
  main { padding: 20px 28px; }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .kpi { background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .kpi .l { font-size: 12px; color: #6b7280; text-transform: uppercase; letter-spacing: .04em; }
  .kpi .v { font-size: 28px; font-weight: 700; color: #0971CE; margin-top: 4px; }
  .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; margin-top: 14px; }
  .card { background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .card h2 { font-size: 14px; margin: 0 0 10px; color: #0971CE; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 7px 8px; border-bottom: 1px solid #eef0f3; text-align: left; }
  th { cursor: pointer; background: #f9fafb; position: sticky; top: 0; user-select: none; }
  th:hover { color: #0971CE; }
  .num { text-align: right; }
  .scroll { max-height: 460px; overflow: auto; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } .kpis { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Sales dashboard</h1>
</header>

<div class="filters">
  <label>Year <select id="fYear"></select></label>
  <label>Status <select id="fStatus"></select></label>
  <label>Job title <select id="fTitle"></select></label>
  <label>Employee search <input id="fSearch" placeholder="Name or ID"></label>
</div>

<main>
  <section class="kpis">
    <div class="kpi"><div class="l">Placements (sales)</div><div class="v" id="kPlace">–</div></div>
    <div class="kpi"><div class="l">Job orders</div><div class="v" id="kJobs">–</div></div>
    <div class="kpi"><div class="l">Fill rate (sales)</div><div class="v" id="kFill">–</div></div>
  </section>

  <section class="grid">
    <div class="card"><h2>Monthly trend</h2><canvas id="cMonth" height="120"></canvas></div>
    <div class="card"><h2>Top 15 employees · placements</h2><canvas id="cTop" height="260"></canvas></div>
  </section>

  <section class="card" style="margin-top:14px">
    <h2>Employee detail</h2>
    <div class="scroll">
      <table>
        <thead>
          <tr>
            <th data-k="name">Employee</th>
            <th data-k="title">Job title</th>
            <th data-k="status">Status</th>
            <th class="num" data-k="placements">Placements</th>
            <th class="num" data-k="jobs">Job orders</th>
            <th class="num" data-k="fill">Fill rate</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </section>
</main>

const EN = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const METRIC = {"placements (sales)": "placements", "job orders": "jobs", "fill rate (sales)": "fill"};

const ROWS = RAW.map(r => {
  const mi = EN.indexOf(r[3]);
  return {
    name: r[0] || "Unassigned",
    id: r[1],
    status: r[2] || "—",
    title: r[5] || "—",
    m: METRIC[r[6]],
    cnt: r[7],
    key: r[4] * 100 + (mi >= 0 ? mi : 99),
    lbl: (mi >= 0 ? SHORT[mi] : r[3]) + " " + r[4]
  };
});

const fmt = n => Number(n).toLocaleString("en-US");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));

function fillSelect(sel, values, allLabel) {
  sel.innerHTML = `<option value="all">${allLabel}</option>` +
    values.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join("");
}
fillSelect(document.getElementById("fYear"), [...new Set(ROWS.map(r => String(r.key / 100 | 0)))].sort(), "All");
fillSelect(document.getElementById("fStatus"), [...new Set(ROWS.map(r => r.status))].sort(), "All");
fillSelect(document.getElementById("fTitle"), [...new Set(ROWS.map(r => r.title))].sort(), "All");

const monthChart = new Chart(document.getElementById("cMonth"), {
  data: {
    labels: [],
    datasets: [
      {type: "bar", label: "Placements", data: [], backgroundColor: "#0971CE", yAxisID: "y"},
      {type: "line", label: "Job orders", data: [], borderColor: "#F59E0B", backgroundColor: "#F59E0B", tension: .3, yAxisID: "y1"},
      {type: "line", label: "Fill rate", data: [], borderColor: "#10B981", backgroundColor: "#10B981", tension: .3, yAxisID: "y1"}
    ]
  },
  options: {
    responsive: true,
    interaction: {mode: "index", intersect: false},
    scales: {
      y: {position: "left", title: {display: true, text: "Placements"}},
      y1: {position: "right", grid: {drawOnChartArea: false}, title: {display: true, text: "Job orders / Fill rate"}}
    }
  }
});

const topChart = new Chart(document.getElementById("cTop"), {
  type: "bar",
  data: {labels: [], datasets: [{label: "Placements", data: [], backgroundColor: "#0971CE"}]},
  options: {indexAxis: "y", plugins: {legend: {display: false}}}
});

let sortKey = "placements";
let sortDir = -1;

function filtered() {
  const y = document.getElementById("fYear").value;
  const s = document.getElementById("fStatus").value;
  const t = document.getElementById("fTitle").value;
  const q = document.getElementById("fSearch").value.trim().toLowerCase();
  return ROWS.filter(r =>
    (y === "all" || String(r.key / 100 | 0) === y) &&
    (s === "all" || r.status === s) &&
    (t === "all" || r.title === t) &&
    (!q || r.name.toLowerCase().includes(q) || String(r.id).toLowerCase().includes(q))
  );
}

function aggregate(rows) {
  const m = new Map();
  for (const r of rows) {
    const k = r.id || r.name;
    if (!m.has(k)) m.set(k, {name: r.name, id: r.id, title: r.title, status: r.status, placements: 0, jobs: 0, fill: 0});
    m.get(k)[r.m] += r.cnt;
  }
  return [...m.values()];
}

function renderTable(list) {
  list.sort((a, b) => {
    const x = a[sortKey], y = b[sortKey];
    return (typeof x === "number" ? x - y : String(x).localeCompare(String(y), "en")) * sortDir;
  });
  document.getElementById("tbody").innerHTML = list.map(e =>
    `<tr><td>${esc(e.name)}</td><td>${esc(e.title)}</td><td>${esc(e.status)}</td>` +
    `<td class="num">${fmt(e.placements)}</td><td class="num">${fmt(e.jobs)}</td><td class="num">${fmt(e.fill)}</td></tr>`
  ).join("");
}

function update() {
  const rows = filtered();

  const tot = {placements: 0, jobs: 0, fill: 0};
  for (const r of rows) tot[r.m] += r.cnt;
  document.getElementById("kPlace").textContent = fmt(tot.placements);
  document.getElementById("kJobs").textContent = fmt(tot.jobs);
  document.getElementById("kFill").textContent = fmt(tot.fill);

  const byMonth = new Map();
  for (const r of rows) {
    if (!byMonth.has(r.key)) byMonth.set(r.key, {label: r.lbl, placements: 0, jobs: 0, fill: 0});
    byMonth.get(r.key)[r.m] += r.cnt;
  }
  const months = [...byMonth.keys()].sort((a, b) => a - b).map(k => byMonth.get(k));
  monthChart.data.labels = months.map(m => m.label);
  monthChart.data.datasets[0].data = months.map(m => m.placements);
  monthChart.data.datasets[1].data = months.map(m => m.jobs);
  monthChart.data.datasets[2].data = months.map(m => m.fill);
  monthChart.update();

  const emp = aggregate(rows);
  const top = emp.filter(e => e.placements > 0).sort((a, b) => b.placements - a.placements).slice(0, 15);
  topChart.data.labels = top.map(e => e.name);
  topChart.data.datasets[0].data = top.map(e => e.placements);
  topChart.update();

  renderTable(emp);
}

document.querySelectorAll("th[data-k]").forEach(th => th.addEventListener("click", () => {
  const k = th.dataset.k;
  sortDir = sortKey === k ? -sortDir : (["placements", "jobs", "fill"].includes(k) ? -1 : 1);
  sortKey = k;
  update();
}));
["fYear", "fStatus", "fTitle"].forEach(id => document.getElementById(id).addEventListener("change", update));
document.getElementById("fSearch").addEventListener("input", update);

update();
